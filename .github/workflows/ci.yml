name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # G48-2026-10-22: eski pin "1.82". zeroize-1.9 (transitif bagimlilik)
        # edition2024 gerektirir -> bu ozellik Rust-1.85'ten once stabilized
        # degildi, yani 1.82'de manifest-parse patlar ( cargo 101). Ayrica
        # workspace-MSRV ( rust-version=1.98.0) 1.85'ten-YUKSEK oldugu-icin
        # kendi-crate'lerimiz-icin-de-desteklenmiyor -> 1.85-bacagi-anlamsiz.
        # Alt-uc-MSRV-ile-hoplayalim.
        rust-version: ["stable", "1.98"]
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Testler
        run: cargo test --all --quiet
  wasm:
    name: kok-wasm light-client boundary ( wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: kok-wasm wasm32-unknown-unknown build
        # G51-6- ( 2026-10-23): light-client-verifier-boundary'in her-
        # giriste-trap-imkansiz-iddiasi-yalnizca-gercek-wasm-derlemesiyle
        # olculur- ( cdylib-hedefi-native-build'lerde-gorunmez).
        run: cargo build --release -p kok-wasm --target wasm32-unknown-unknown
      - name: kok-wasm npm-package-paketleme-ornegi
        run: cargo run -p kok-wasm --example package_npm
      - name: kok-wasm-examples-derleniyor- ( trap-free-iddiasi)
        run: cargo build -p kok-wasm --examples
